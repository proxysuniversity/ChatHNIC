
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatHNIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --sidebar: #080808;
  --surface: #171717;
  --surface2: #252525;
  --text: #ededed;
  --muted: #999;
  --border: #ffffff17;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  font-size: 14px;
}
button, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
.app { display: flex; height: 100dvh; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 13px;
  border-right: 1px solid #ffffff0c;
  transition: transform .22s;
  overflow: hidden;
}
.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 3px 2px;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.brand img {
  display: block;
  width: 210px;
  height: 105px;
  object-fit: contain;
  object-position: center;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border: 0;
  background: transparent;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  transition: background .15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: #ffffff12; color: white; }
.icon-btn svg { width: 19px; height: 19px; }
.new-chat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: transparent;
  text-align: left;
  font-weight: 500;
  margin-bottom: 22px;
}
.new-chat:hover { background: #ffffff0b; }
.section-label {
  color: #888;
  font-size: 12px;
  font-weight: 600;
  padding: 0 9px;
  margin-bottom: 9px;
}
.history { flex: 1; overflow-y: auto; }
.history-item {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  color: #d1d1d1;
  white-space: nowrap;
  overflow: hidden;
  margin-bottom: 2px;
}
.history-item:hover, .history-item.active { background: #ffffff12; }
.history-item span { overflow: hidden; text-overflow: ellipsis; }
.history-delete {
  opacity: 0;
  border: 0;
  background: transparent;
  color: #999;
  flex-shrink: 0;
}
.history-item:hover .history-delete { opacity: 1; }
.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 5px;
}
.profile-icon {
  width: 30px;
  height: 30px;
  background: #252525;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 600;
}
.profile-info { line-height: 1.5; }
.profile-info strong { font-weight: 550; }
.profile-info small { display: block; color: #929292; font-size: 11px; }

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #000;
}
.topbar {
  height: 57px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 19px;
  background: #000;
}
.top-left, .top-right { display: flex; align-items: center; gap: 10px; }
.mobile-brand { display: none; }
.model-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.35px;
}
.model-status {
  font-size: 11px;
  color: #999;
  margin-left: 3px;
}
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #d0a65c;
  border-radius: 50%;
  margin-right: 5px;
}
.model-ready .status-dot { background: #65b98a; }

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
  background: #000;
}
.chat-content {
  width: 100%;
  max-width: 790px;
  margin: 0 auto;
  padding: 35px 27px;
}
.welcome {
  position: absolute;
  top: 44%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: min(90%,700px);
  text-align: center;
  animation: appear .5s ease both;
}
.welcome h1 {
  font-size: clamp(27px,4vw,34px);
  font-weight: 550;
  letter-spacing: -1.5px;
  margin: 0;
}
.messages { display: flex; flex-direction: column; gap: 29px; }
.message {
  display: flex;
  flex-direction: column;
  animation: messageIn .3s ease both;
}
.user-message { align-items: flex-end; }
.user-bubble {
  max-width: 82%;
  background: #202020;
  padding: 12px 17px;
  border-radius: 20px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.assistant-message { align-items: stretch; }
.assistant-text {
  font-size: 15px;
  line-height: 1.75;
  color: #ededed;
  overflow-wrap: anywhere;
}
.assistant-text p { margin: 0 0 14px; }
.assistant-text p:last-child { margin-bottom: 0; }
.assistant-text h1,.assistant-text h2,.assistant-text h3 {
  letter-spacing: -.5px;
  line-height: 1.3;
  margin: 22px 0 10px;
}
.assistant-text h1 { font-size: 23px; }
.assistant-text h2 { font-size: 20px; }
.assistant-text h3 { font-size: 17px; }
.assistant-text pre {
  background: #101010;
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
  border: 1px solid var(--border);
  margin: 12px 0;
}
.assistant-text code {
  background: #ffffff12;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: .9em;
}
.assistant-text pre code { background: none; padding: 0; }
.assistant-text ul,.assistant-text ol { padding-left: 25px; }
.assistant-text li { margin: 6px 0; }
.assistant-text blockquote {
  border-left: 3px solid #777;
  padding-left: 14px;
  color: #bbb;
  margin-left: 0;
}
.message-actions {
  display: flex;
  gap: 5px;
  margin-top: 10px;
  opacity: .65;
}
.message-actions button {
  border: 0;
  background: transparent;
  color: #aaa;
  padding: 6px;
  border-radius: 7px;
}
.message-actions button:hover { background: #ffffff15; color: white; }
.message-actions svg { width: 16px; height: 16px; }
.typing { display: flex; gap: 5px; padding: 9px 2px; }
.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #aaa;
  animation: pulse 1.1s infinite;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }

.composer-area {
  width: 100%;
  max-width: 790px;
  padding: 10px 27px 12px;
  margin: 0 auto;
  flex-shrink: 0;
  background: #000;
}
.composer {
  background: #171717;
  border: 1px solid #ffffff20;
  border-radius: 25px;
  padding: 12px 13px 9px 17px;
  box-shadow: 0 4px 20px #00000012;
  transition: border-color .2s;
}
.composer:focus-within { border-color: #ffffff45; }
#prompt {
  display: block;
  resize: none;
  outline: none;
  border: 0;
  background: transparent;
  color: white;
  width: 100%;
  min-height: 28px;
  max-height: 180px;
  line-height: 1.55;
  font-size: 15px;
  padding: 3px 0;
}
#prompt::placeholder { color: #999; }
.composer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 7px;
}
.composer-tools { display: flex; align-items: center; gap: 4px; }
.composer-tools button {
  border: 0;
  background: transparent;
  color: #b7b7b7;
  border-radius: 20px;
  padding: 7px;
  display: grid;
  place-items: center;
}
.composer-tools button:hover { background: #ffffff13; color: white; }
.composer-tools svg { width: 19px; height: 19px; }
.send-btn {
  width: 35px;
  height: 35px;
  border: none;
  background: white;
  color: #171717;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { opacity: .35; cursor: default; transform: none; }
.send-btn svg { width: 18px; height: 18px; }
.disclaimer {
  color: #777;
  font-size: 11px;
  text-align: center;
  padding-top: 10px;
}

.github-signin {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  height: 36px; padding: 0 14px; border: 1px solid #e5e5e5; border-radius: 8px;
  background: #fff; color: #111; font-size: 12px; font-weight: 650;
  white-space: nowrap; transition: background .15s, transform .15s;
}
.github-signin:hover { background: #eaeaea; transform: translateY(-1px); }
.github-signin svg { width: 17px; height: 17px; flex-shrink: 0; }
.github-signin.signed-in { background: #f0f0f0; }
.github-note { color: #aaa; font-size: 12px; line-height: 1.6; margin-top: 10px; }
.github-user { display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border); border-radius:10px; margin-top:14px; }
.github-avatar { width:34px;height:34px;border-radius:50%;background:#292929;display:grid;place-items:center;font-weight:700; }
.github-auth-overlay { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:20px; background:#000c; backdrop-filter:blur(6px); }
.github-auth-dialog { width:min(100%,430px); padding:25px; border-radius:16px; border:1px solid #ffffff24; background:#151515; box-shadow:0 20px 70px #000a; }
.github-auth-dialog h2 { margin:0 0 8px; font-size:20px; }
.github-auth-dialog p { color:#aaa; font-size:13px; line-height:1.65; }
.github-code { margin:18px 0 12px; padding:17px 12px; border:1px solid #ffffff24; border-radius:10px; background:#080808; text-align:center; font-size:27px; font-weight:700; letter-spacing:4px; user-select:all; }
.github-auth-actions { display:flex; gap:9px; margin-top:16px; }
.github-auth-actions button,.github-auth-actions a { flex:1; display:flex; align-items:center; justify-content:center; min-height:40px; border-radius:8px; border:1px solid #ffffff25; background:#242424; color:white; font:600 13px Inter,sans-serif; text-decoration:none; cursor:pointer; }
.github-auth-actions .primary { background:white; color:#111; border-color:white; }
.github-auth-status { min-height:20px; color:#aaa; font-size:12px; margin-top:13px; }
.hidden { display: none !important; }
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000c;
  display: grid;
  place-items: center;
  padding: 20px;
  backdrop-filter: blur(5px);
}
.dialog {
  width: min(100%,420px);
  background: #141414;
  border: 1px solid #ffffff20;
  border-radius: 17px;
  padding: 25px;
  box-shadow: 0 15px 70px #0008;
  animation: appear .2s ease both;
}
.dialog h2 { font-size: 19px; margin: 0 0 8px; }
.dialog p { color: #aaa; line-height: 1.6; font-size: 13px; }
.progress-track {
  width: 100%;
  height: 5px;
  background: #ffffff20;
  border-radius: 5px;
  overflow: hidden;
  margin: 19px 0 9px;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: white;
  border-radius: 5px;
  transition: width .2s;
}
.progress-text { font-size: 12px; color: #aaa; }
.dialog-btn {
  width: 100%;
  margin-top: 17px;
  padding: 11px;
  border: none;
  background: white;
  color: black;
  font-weight: 600;
  border-radius: 9px;
}
.dialog-btn:disabled { opacity: .5; }

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes messageIn {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%,60%,100% { opacity: .35; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    z-index: 5;
    height: 100%;
    left: 0;
    top: 0;
    transform: translateX(-100%);
    width: 270px;
  }
  .sidebar.open { transform: translateX(0); }
  .brand img { width: 220px; height: 110px; }
  .mobile-brand {
    display: flex;
    align-items: center;
  }
  .mobile-brand img {
    width: 45px;
    height: 36px;
    object-fit: contain;
  }
  .mobile-brand strong { display: none; }
  .topbar { padding: 0 12px; }
  .github-signin { padding: 0 9px; gap: 6px; font-size: 11px; }
  .model-status { display: none; }
  .chat-content { padding: 25px 18px; }
  .composer-area { padding: 8px 12px 10px; }
  .welcome { top: 43%; }
  .welcome h1 { font-size: 27px; }
  .user-bubble { max-width: 90%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="https://proxysuniversity.github.io/aaron-carters-arcade/ChatHNIC%20Thief%20Emblem.png" alt="ChatHNIC emblem">
      </div>
      <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button class="new-chat" id="newChat">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="section-label">Your chats</div>
    <div class="history" id="history"></div>
    <div class="sidebar-bottom">
      <div class="profile">
        <div class="profile-icon">C</div>
        <div class="profile-info">
          <strong>ChatHNIC</strong>
          <small>ChatHNIC Assistant</small>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="openSidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="mobile-brand">
          <img src="https://proxysuniversity.github.io/aaron-carters-arcade/ChatHNIC%20Thief%20Emblem.png" alt="ChatHNIC emblem">
        </div>
        <div class="model-name">ChatHNIC <span style="color:#999;font-weight:400">2.0</span></div>
      </div>
      <div class="top-right">
        <span class="model-status" id="modelStatus"><span class="status-dot"></span>Ready</span>
        <button class="github-signin" id="githubSignIn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.7 1.15 1.7 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.24-5.11 5.51.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
          <span>Sign in with GitHub</span>
        </button>
      </div>
    </header>
    <div class="chat-scroll" id="chatScroll">
      <div class="welcome" id="welcome"><h1> </h1></div>
      <div class="chat-content"><div class="messages" id="messages"></div></div>
    </div>
    <div class="composer-area">
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="Message ChatHNIC..." aria-label="Message ChatHNIC"></textarea>
        <div class="composer-bottom">
          <div class="composer-tools">
            <button id="attachBtn" title="Attach a file" aria-label="Attach a file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">ChatHNIC can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" hidden accept="image/*,.txt,.pdf">

<script>
const $ = id => document.getElementById(id);
const promptInput = $("prompt"), messagesEl = $("messages"), welcome = $("welcome"), chatScroll = $("chatScroll"), sendBtn = $("sendBtn");
let generating = false, currentChatId = null, githubUser = null;
let chats = [];
try { chats = JSON.parse(localStorage.getItem("chathnic_chats") || "[]"); if (!Array.isArray(chats)) chats = []; } catch { chats = []; }
function saveChats(){ try{localStorage.setItem("chathnic_chats",JSON.stringify(chats));}catch(e){console.warn(e);} }
function getChat(){return chats.find(c=>c.id===currentChatId);}
function createChat(){const chat={id:crypto.randomUUID(),title:"New chat",messages:[],updated:Date.now()};chats.unshift(chat);currentChatId=chat.id;saveChats();renderChat();renderHistory();promptInput.focus();$("sidebar").classList.remove("open");}
function renderHistory(){const history=$("history");history.replaceChildren();chats.forEach(chat=>{const item=document.createElement("div");item.className="history-item"+(chat.id===currentChatId?" active":"");const name=document.createElement("span");name.textContent=chat.title||"New chat";const del=document.createElement("button");del.className="history-delete";del.textContent="×";del.title="Delete chat";del.addEventListener("click",e=>{e.stopPropagation();chats=chats.filter(c=>c.id!==chat.id);if(currentChatId===chat.id)currentChatId=null;saveChats();renderHistory();renderChat();});item.append(name,del);item.addEventListener("click",()=>{currentChatId=chat.id;renderChat();renderHistory();$("sidebar").classList.remove("open");});history.appendChild(item);});}
function escapeHTML(str){return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function markdown(text){let value=escapeHTML(text),blocks=[];value=value.replace(/```([\w-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{let i=blocks.length;blocks.push(`<pre><code>${code.trim()}</code></pre>`);return `%%CODE${i}%%`;});value=value.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>").replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);value=value.split(/\n{2,}/).map(part=>{if(/^<(h[1-3]|ul|ol|pre|blockquote)/.test(part)||/^%%CODE\d+%%$/.test(part))return part;return `<p>${part.replace(/\n/g,"<br>")}</p>`;}).join("");return value.replace(/%%CODE(\d+)%%/g,(_,i)=>blocks[Number(i)]);}
function addMessageElement(role,content){const wrap=document.createElement("div");wrap.className="message "+(role==="user"?"user-message":"assistant-message");if(role==="user"){const bubble=document.createElement("div");bubble.className="user-bubble";bubble.textContent=content;wrap.appendChild(bubble);}else{const text=document.createElement("div");text.className="assistant-text";text.innerHTML=markdown(content);wrap.appendChild(text);}messagesEl.appendChild(wrap);return wrap;}
function renderChat(){messagesEl.replaceChildren();const chat=getChat(),hasMessages=!!chat?.messages.length;welcome.classList.toggle("hidden",hasMessages);if(!chat)return;chat.messages.forEach(m=>addMessageElement(m.role,m.content));scrollToBottom();}
function scrollToBottom(){requestAnimationFrame(()=>chatScroll.scrollTop=chatScroll.scrollHeight);}
function setStatus(text,ready=true){$("modelStatus").innerHTML=`<span class="status-dot"></span>${text}`;$("modelStatus").classList.toggle("model-ready",ready);}

/* ChatHNIC's offline answer library. These are fixed, authored answers and
   deterministic topic variations; no Qwen download, WebGPU, API, or key is needed. */
const TOPICS = [
["addition","Adding numbers means combining quantities. Line up place values, add from right to left, and carry when a column reaches ten."],
["subtraction","Subtraction finds the difference between quantities. Line up place values and regroup from the next column when needed."],
["multiplication","Multiplication is repeated addition. For multi-digit problems, multiply each place value and add the partial products."],
["division","Division splits a quantity into equal groups. Check a result by multiplying the quotient by the divisor and adding any remainder."],
["fractions","A fraction represents part of a whole. The numerator counts selected parts; the denominator tells how many equal parts make the whole."],
["decimals","Decimals are another way to write fractions with denominators of 10, 100, 1000, and so on. Keep decimal points aligned when adding or subtracting."],

if(/\b(help|what can you do|capabilities)\b/.test(low))return "I can answer built-in questions about math, algebra, geometry, physics, chemistry, biology, health education, fitness, programming, HTML, CSS, JavaScript, Python, Roblox, history, geography, writing, finance basics, and everyday topics. I also solve simple arithmetic. This is a fixed offline response library, so it won't know everything or learn new facts from the internet.";
return "Could you tell me a little more about what you mean? I want to make sure I answer the right question.";
}
function showError(message){const error=document.createElement("div");error.className="error";error.style.cssText="color:#e99;padding:10px 2px";error.textContent=message;messagesEl.appendChild(error);scrollToBottom();}
async function sendMessage(){const text=promptInput.value.trim();if(!text||generating)return;if(!currentChatId||!getChat())createChat();const chat=getChat();chat.messages.push({role:"user",content:text});if(chat.messages.length===1)chat.title=text.length>35?text.slice(0,35)+"...":text;chat.updated=Date.now();saveChats();renderHistory();welcome.classList.add("hidden");addMessageElement("user",text);promptInput.value="";promptInput.style.height="auto";generating=true;sendBtn.disabled=true;const assistantWrap=addMessageElement("assistant","");const assistantText=assistantWrap.querySelector(".assistant-text");const typing=document.createElement("div");typing.className="typing";typing.innerHTML="<span></span><span></span><span></span>";assistantText.appendChild(typing);scrollToBottom();setStatus("Thinking",true);
try{const answer=generateFakeResponse(text);await new Promise(resolve=>setTimeout(resolve,350+Math.min(answer.length*2,850)));typing.remove();let shown="";for(let i=0;i<answer.length;i+=5){shown=answer.slice(0,i+5);assistantText.innerHTML=markdown(shown);if(i%35===0)scrollToBottom();await new Promise(resolve=>setTimeout(resolve,5));}chat.messages.push({role:"assistant",content:answer});chat.updated=Date.now();saveChats();const actions=document.createElement("div");actions.className="message-actions";const copy=document.createElement("button");copy.textContent="Copy";copy.addEventListener("click",()=>navigator.clipboard.writeText(answer).then(()=>copy.textContent="Copied").catch(()=>{}));actions.appendChild(copy);assistantWrap.appendChild(actions);
}catch(error){typing.remove();showError("Something went wrong: "+(error.message||"Unknown error"));}finally{generating=false;sendBtn.disabled=!promptInput.value.trim();promptInput.focus();scrollToBottom();setStatus("you're response is ready...",true);}}

// GitHub OAuth Device Flow. The OAuth app must have "Enable Device Flow" switched on.
const GITHUB_CLIENT_ID = "3bb1acc2648aad85212a70404e144017c39c51bf";
const GITHUB_DEVICE_URL = "https://github.com/login/device";
let githubAccessToken = "";
let githubAuthCancelled = false;
let githubAuthOverlay = null;
try { githubAccessToken = sessionStorage.getItem("chathnic_github_access_token") || ""; } catch {}

function updateGitHubButton(){
  const b=$("githubSignIn");
  if(githubUser){b.classList.add("signed-in");b.querySelector("span").textContent=githubUser;}
  else{b.classList.remove("signed-in");b.querySelector("span").textContent="Sign in with GitHub";}
}
function closeGitHubAuth(){githubAuthCancelled=true;if(githubAuthOverlay){githubAuthOverlay.remove();githubAuthOverlay=null;}}
function makeGitHubAuthDialog(code,statusText){
  closeGitHubAuth();githubAuthCancelled=false;
  const overlay=document.createElement("div");overlay.className="github-auth-overlay";
  const dialog=document.createElement("section");dialog.className="github-auth-dialog";
  const heading=document.createElement("h2");heading.textContent="Sign in with GitHub";
  const desc=document.createElement("p");desc.textContent="A secure GitHub verification code has been created. Open GitHub, sign in, and enter this code to authorize ChatHNIC.";
  const codeBox=document.createElement("div");codeBox.className="github-code";codeBox.textContent=code;
  const actions=document.createElement("div");actions.className="github-auth-actions";
  const open=document.createElement("a");open.className="primary";open.href=GITHUB_DEVICE_URL;open.target="_blank";open.rel="noopener noreferrer";open.textContent="Open GitHub";
  const copy=document.createElement("button");copy.type="button";copy.textContent="Copy code";copy.addEventListener("click",()=>{navigator.clipboard?.writeText(code).then(()=>{copy.textContent="Copied";}).catch(()=>{copy.textContent="Select code above";});});
  actions.append(open,copy);
  const status=document.createElement("div");status.className="github-auth-status";status.textContent=statusText||"Waiting for GitHub authorization…";
  const cancelRow=document.createElement("div");cancelRow.className="github-auth-actions";
  const cancel=document.createElement("button");cancel.type="button";cancel.textContent="Cancel";cancel.addEventListener("click",closeGitHubAuth);cancelRow.appendChild(cancel);
  dialog.append(heading,desc,codeBox,actions,status,cancelRow);overlay.appendChild(dialog);overlay.addEventListener("click",e=>{if(e.target===overlay)closeGitHubAuth();});document.body.appendChild(overlay);
  githubAuthOverlay=overlay;return {status,copy};
}
async function githubPost(url,params){
  const response=await fetch(url,{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(params)});
  const data=await response.json();
  if(!response.ok && !data.error)throw new Error("GitHub request failed ("+response.status+").");
  return data;
}
async function finishGitHubSignIn(token){
  const response=await fetch("https://api.github.com/user",{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}});
  if(!response.ok)throw new Error("GitHub authorized the app, but the profile could not be loaded.");
  const profile=await response.json();
  githubAccessToken=token;githubUser=profile.login||"GitHub user";
  try{sessionStorage.setItem("chathnic_github_access_token",token);}catch{}
  updateGitHubButton();
  if(githubAuthOverlay){githubAuthOverlay.remove();githubAuthOverlay=null;}
}
async function startGitHubSignIn(){
  if(githubUser){
    if(confirm("Sign out of GitHub in ChatHNIC?")){githubUser=null;githubAccessToken="";try{sessionStorage.removeItem("chathnic_github_access_token");}catch{}updateGitHubButton();}
    return;
  }
  const button=$("githubSignIn");button.disabled=true;
  try{
    const device=await githubPost("https://github.com/login/device/code",{client_id:GITHUB_CLIENT_ID,scope:"read:user"});
    if(device.error)throw new Error(device.error==="device_flow_disabled"?"Device Flow is not enabled for this GitHub OAuth app. Open the app settings on GitHub and enable ‘Enable Device Flow’, then try again.":device.error_description||device.error);
    const ui=makeGitHubAuthDialog(device.user_code,"Waiting for you to enter the code on GitHub…");
    let interval=Math.max(5,Number(device.interval)||5);
    const expiresAt=Date.now()+(Number(device.expires_in)||900)*1000;
    while(!githubAuthCancelled&&Date.now()<expiresAt){
      await new Promise(resolve=>setTimeout(resolve,interval*1000));
      if(githubAuthCancelled)break;
      const result=await githubPost("https://github.com/login/oauth/access_token",{client_id:GITHUB_CLIENT_ID,device_code:device.device_code,grant_type:"urn:ietf:params:oauth:grant-type:device_code"});
      if(result.access_token){await finishGitHubSignIn(result.access_token);break;}
      if(result.error==="authorization_pending"){if(githubAuthOverlay)ui.status.textContent="Waiting for you to approve ChatHNIC on GitHub…";continue;}
      if(result.error==="slow_down"){interval=Math.max(interval+5,Number(result.interval)||0);if(githubAuthOverlay)ui.status.textContent="GitHub asked us to slow down. Still waiting…";continue;}
      if(result.error==="access_denied")throw new Error("You denied the GitHub authorization request.");
      if(result.error==="expired_token"||result.error==="token_expired")throw new Error("That GitHub code expired. Please click Sign in with GitHub to try again.");
      if(result.error)throw new Error(result.error_description||result.error);
    }
    if(!githubUser&&!githubAuthCancelled&&githubAuthOverlay)ui.status.textContent="This code expired. Close this window and try again.";
  }catch(error){
    if(githubAuthOverlay){const status=githubAuthOverlay.querySelector(".github-auth-status");if(status)status.textContent=error.message||"GitHub sign-in failed.";}
    else alert("GitHub sign-in failed: "+(error.message||"Unknown error"));
    console.error("GitHub OAuth:",error);
  }finally{button.disabled=false;}
}
$("githubSignIn").addEventListener("click",startGitHubSignIn);
async function restoreGitHubSession(){
  if(!githubAccessToken)return;
  try{const response=await fetch("https://api.github.com/user",{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+githubAccessToken,"X-GitHub-Api-Version":"2022-11-28"}});if(response.ok){const profile=await response.json();githubUser=profile.login||"GitHub user";}else{sessionStorage.removeItem("chathnic_github_access_token");githubAccessToken="";}}
  catch{githubUser=null;}
  updateGitHubButton();
}
updateGitHubButton();restoreGitHubSession();
sendBtn.addEventListener("click",sendMessage);promptInput.addEventListener("input",()=>{promptInput.style.height="auto";promptInput.style.height=Math.min(promptInput.scrollHeight,180)+"px";sendBtn.disabled=!promptInput.value.trim()||generating;});promptInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
$("newChat").addEventListener("click",createChat);$("openSidebar").addEventListener("click",()=>$("sidebar").classList.add("open"));$("closeSidebar").addEventListener("click",()=>$("sidebar").classList.remove("open"));$("attachBtn").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;if(file.type==="text/plain"){promptInput.value+="\nFile contents:\n"+(await file.text()).slice(0,12000);}else{promptInput.value+="\n[Selected file: "+file.name+"]";}promptInput.dispatchEvent(new Event("input"));$("fileInput").value="";});
if(!chats.length)createChat();else{currentChatId=chats[0].id;renderHistory();renderChat();}setStatus("you're ai is ready sirch..",true);
